services:
  mysql:
    image: mysql:8
    container_name: mysql-test
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: board
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: redis-test
    ports:
      - "6379:6379"

volumes:
  mysql-data: